name: Build KomiKku APK (no-firebase)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build app
    runs-on: ubuntu-24.04

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Stub google-services.json
        run: |
          mkdir -p app/src/main/assets
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {"project_number": "0", "project_id": "komikku-stub", "storage_bucket": "komikku-stub.appspot.com"},
            "client": [],
            "configuration_version": "1"
          }
          EOF
          cat > app/src/main/assets/client_secrets.json << 'EOF'
          {"installed": {"client_id": "stub", "project_id": "komikku-stub", "auth_uri": "https://accounts.google.com/o/oauth2/auth", "token_uri": "https://oauth2.googleapis.com/token", "client_secret": "stub", "redirect_uris": ["urn:ietf:wg:oauth:2.0:oob"]}}
          EOF

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        run: echo "${{ secrets.SIGNING_KEY_B64 }}" | base64 -d > /tmp/signing.jks

      - name: Build app
        run: ./gradlew assemblePreview --no-daemon --stacktrace

      - name: Sign APK
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.1"
          "$BUILD_TOOLS/zipalign" -f 4 app/build/outputs/apk/preview/app-universal-preview-unsigned.apk aligned.apk || \
          "$BUILD_TOOLS/zipalign" -f 4 app/build/outputs/apk/preview/*.apk aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks /tmp/signing.jks --ks-pass pass:komiova123 --key-pass pass:komiova123 --out Komikku-preview.apk aligned.apk
          "$BUILD_TOOLS/apksigner" verify Komikku-preview.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Komikku-preview-apk
          path: Komikku-preview.apk
